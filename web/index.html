<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokémonDB — Pokédex & team tools</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/main.css">
<link rel="stylesheet" href="/styles/database.css">
</head>
<body>
<div class="app-shell">
  <nav class="rail" aria-label="Primary">
    <div class="rail__brand">
      <svg class="rail__brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9.5" fill="var(--red)" stroke="var(--ink)" stroke-width="2"/>
        <path d="M2.5 12a9.5 9.5 0 0 1 19 0" fill="var(--red)" stroke="var(--ink)" stroke-width="2"/>
        <path d="M2.5 12a9.5 9.5 0 0 0 19 0" fill="var(--white)" stroke="var(--ink)" stroke-width="2"/>
        <path d="M2.5 12h7a2.5 2.5 0 0 0 5 0h7" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="12" cy="12" r="2.6" fill="var(--white)" stroke="var(--ink)" stroke-width="2"/>
      </svg>
      <span class="rail__brand-name">PokémonDB</span>
    </div>
    <ul class="rail__nav" id="rail-nav">
      <li><a class="rail__link" data-route="dex" href="#/dex">Pokédex</a></li>
      <li><a class="rail__link" data-route="collection" href="#/collection">My collection</a></li>
      <li><a class="rail__link" data-route="teams" href="#/teams">Team builder</a></li>
      <li><a class="rail__link" data-route="battle" href="#/battle">Battle planner</a></li>
      <li><a class="rail__link" data-route="account" href="#/account">Account</a></li>
    </ul>
    <div class="rail__footer" id="rail-footer"></div>
  </nav>

  <div class="main-col">
    <header class="topbar">
      <input class="input topbar__search" id="global-search" type="search"
             placeholder="Search by name or number…" aria-label="Search Pokédex">
      <div id="topbar-account"></div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="mobile-tabbar" aria-label="Primary">
  <a data-route="dex" href="#/dex">Dex</a>
  <a data-route="collection" href="#/collection">Collection</a>
  <a data-route="teams" href="#/teams">Teams</a>
  <a data-route="battle" href="#/battle">Battle</a>
  <a data-route="account" href="#/account">Account</a>
</nav>

<div id="drawer-root"></div>
<div id="toast-root" class="visually-hidden" role="status" aria-live="polite"></div>

<script type="module" src="/scripts/main.js"></script>
</body>
</html>
